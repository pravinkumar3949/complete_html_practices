<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table border="3">
        <caption>Electronics Items</caption>
        <tr>
                <th>Items</th>
                <th>Quantity</th>
                <th>Prices</th>
        </tr>
        <tr>
            <td rowspan="2">Laptop</td>
            <td>2</td>
            <td>23k</td>
        </tr>
        <tr>
            <td>Phones</td>
            <td>2</td>
            <td>100k</td>
        </tr>
        <tr>
            <td>Tablets</td>
            <td>2</td>
            <td>27k</td>
        </tr>
    </table>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>column span table</title>
</head>
<body>
    <caption >My Tech.. Grade</caption>
    <table border="2">
        <tr>
            <th colspan="3">I am Good dev..</th>
        </tr>
        <tr>
            <th>Lang</th>
            <th>Grade</th>
            <th>Years</th>
        </tr>
        <tr>
            <td>java</td>
            <td>A</td>
            <td>3</td>
        </tr>
        <tr>
            <td>Python</td>
            <td>B</td>
            <td>2</td>
        </tr>
        <tr>
            <td colspan="2">HTML</td>
            <td>A+</td>

        </tr>

    </table>
</body>
</html>

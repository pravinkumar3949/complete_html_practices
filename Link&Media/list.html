<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <ol type="">
         <li>ABC</li>
         <li>BCD</li>
         <li>DEF</li>
         <li>FGH</li>
         <li>IJK</li>
    </ol>
    <!-- OL tag is order list-->
    <ul >
       <li>ABC</li>
         <li>BCD</li>
         <li>DEF</li>
         <li>FGH</li>
         <li>IJK</li>
          <!-- uL tag is unorder list-->

    </ul>
</body>
</html>

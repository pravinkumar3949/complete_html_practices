<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lested Lists</title>
</head>
<body>
    <ul>
    <li>Fruits</li>
    <li>Vegetable
        <!-- Nested List Started Here -->
         <ul>
            <li>patato</li>
            <li>Tamato</li>
         </ul>
    </li>
    </ul>
    <!-- This is unorder lists-->


    <ol>
    <li>Fruits</li>
    <li>Vegetable
        <ol type="A">
        <li>Tamato</li>
        <li>Patato</li>
        </ol>
    </li>
    </ol>
</body>
</html>
